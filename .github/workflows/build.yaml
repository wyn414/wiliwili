name: Build wiliwili for RG35XX Pro

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    # 1) 检出代码
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2) 安装最基本依赖
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu

    # 3) 构建 wiliwili（只编译二进制文件）
    - name: Build wiliwili binary
      run: |
        cd ${{ github.workspace }}
        
        echo "=== 开始构建 wiliwili ==="
        
        # 创建构建目录
        mkdir -p build
        cd build
        
        # 最简单直接的配置
        cmake .. \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DCMAKE_BUILD_TYPE=Release \
          # 必须设置平台目标
          -DPLATFORM_DESKTOP=ON \
          # 图形后端
          -DWILIWILI_USE_SDL2=ON \
          -DWILIWILI_USE_OPENGL=OFF \
          -DWILIWILI_USE_OPENGL_ES=ON \
          -DWILIWILI_USE_VULKAN=OFF \
          # MPV支持
          -DWILIWILI_USE_MPV=OFF
        
        echo "编译..."
        make -j$(nproc)
        
        echo "构建完成！"
        if [ -f "wiliwili" ]; then
          echo "✅ 成功生成二进制文件"
          file wiliwili
          ls -lh wiliwili
        else
          echo "❌ 未找到 wiliwili 文件"
          exit 1
        fi

    # 4) 上传二进制文件
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: wiliwili-binary-aarch64
        path: ${{ github.workspace }}/build/wiliwili
        retention-days: 30