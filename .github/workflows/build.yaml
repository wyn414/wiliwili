name: Build wiliwili for RG35XX Pro

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          gcc-arm-linux-gnueabihf \
          g++-arm-linux-gnueabihf \
          cmake \
          autoconf automake libtool \
          pkg-config

    - name: Build SDL2
      run: |
        git clone https://github.com/libsdl-org/SDL.git
        cd SDL
        ./autogen.sh
        ./configure \
          --host=arm-linux-gnueabihf \
          --disable-video-x11 \
          --enable-video-kmsdrm \
          --enable-video-opengles \
          --prefix=$PWD/install
        make -j$(nproc)
        make install

    - name: Build wiliwili
      run: |
        mkdir build && cd build
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=toolchain/arm-linux-gnueabihf.cmake \
          -DSDL2_DIR=$GITHUB_WORKSPACE/SDL/install \
          -DWILIWILI_RENDER=opengles
        make -j$(nproc)

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wiliwili-rg35xx
        path: build/wiliwili
