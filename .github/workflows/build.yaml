name: Build wiliwili for RG35XX Pro (aarch64)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    # 1) 检出代码
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    # 2) 安装交叉编译工具链和必要工具
    - name: Install toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          pkg-config \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu \
          python3 \
          python3-pip \
          wget \
          curl

    # 3) 构建 wiliwili（最简单的配置）
    - name: Build wiliwili
      run: |
        cd ${{ github.workspace }}
        
        echo "=== 创建构建目录 ==="
        mkdir -p build
        cd build
        
        echo "=== 配置 wiliwili ==="
        
        # 最简单的配置，先确保能通过 toolchain.cmake 的检查
        cmake .. \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DCMAKE_BUILD_TYPE=Release \
          -DPLATFORM_DESKTOP=ON \
          -DWILIWILI_USE_MPV=OFF \
          -DUSE_SYSTEM_SDL2=OFF \
          -DUSE_LIBROMFS=ON \
          -DUSE_SYSTEM_CURL=ON
        
        echo "=== 开始编译 ==="
        make -j$(nproc)
        
        if [ -f "wiliwili" ]; then
          echo "✅ 构建成功！"
          echo "文件信息："
          file wiliwili
          echo "大小："
          ls -lh wiliwili
          
          # 检查架构
          echo "架构："
          aarch64-linux-gnu-objdump -f wiliwili 2>/dev/null | grep "architecture" || echo "使用 file 命令："
          file wiliwili
        else
          echo "❌ 未找到可执行文件 wiliwili"
          echo "当前目录内容："
          ls -la
          echo "尝试查找任何可执行文件："
          find . -type f -executable | head -10
          exit 1
        fi

    # 4) 上传二进制文件
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: wiliwili-aarch64-binary
        path: ${{ github.workspace }}/build/wiliwili
        retention-days: 30