name: Build wiliwili for RG35XX Pro

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
    # 1) 检出代码
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2) 安装工具
    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

    # 3) 直接修改 CMakeLists.txt 以跳过 MPV
    - name: Patch CMakeLists.txt to skip MPV
      run: |
        cd ${{ github.workspace }}
        
        echo "=== 修改 CMakeLists.txt 以跳过 MPV ==="
        
        # 备份原始文件
        cp CMakeLists.txt CMakeLists.txt.backup
        
        # 使用 sed 直接注释掉 find_package(MPV REQUIRED)
        # 找到包含 "find_package(MPV REQUIRED)" 的行并注释掉
        sed -i 's/^[[:space:]]*find_package(MPV REQUIRED)/#find_package(MPV REQUIRED)/' CMakeLists.txt
        
        # 同时注释掉相关的消息和列表添加
        sed -i 's/^[[:space:]]*message(STATUS "Found libmpv:/#message(STATUS "Found libmpv:/' CMakeLists.txt
        sed -i 's/^[[:space:]]*list(APPEND APP_PLATFORM_INCLUDE ${MPV_INCLUDE_DIR})/#list(APPEND APP_PLATFORM_INCLUDE ${MPV_INCLUDE_DIR})/' CMakeLists.txt
        sed -i 's/^[[:space:]]*list(APPEND APP_PLATFORM_LIB ${MPV_LIBRARY})/#list(APPEND APP_PLATFORM_LIB ${MPV_LIBRARY})/' CMakeLists.txt
        
        echo "CMakeLists.txt 已修改"

    # 4) 构建 wiliwili
    - name: Build wiliwili
      run: |
        cd ${{ github.workspace }}
        
        echo "=== 构建 wiliwili (MPV 已跳过) ==="
        
        mkdir -p build
        cd build
        
        echo "配置..."
        cmake .. \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DCMAKE_BUILD_TYPE=Release \
          -DPLATFORM_DESKTOP=ON
        
        echo "编译..."
        make -j$(nproc)
        
        if [ -f "wiliwili" ]; then
          echo "✅ wiliwili 构建成功！"
          echo "文件信息："
          file wiliwili
          echo "大小："
          ls -lh wiliwili
          
          # 恢复原始文件
          cd ..
          mv CMakeLists.txt.backup CMakeLists.txt
          echo "CMakeLists.txt 已恢复"
        else
          echo "❌ 构建失败"
          exit 1
        fi

    # 5) 上传二进制文件
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: wiliwili-aarch64
        path: ${{ github.workspace }}/build/wiliwili
        retention-days: 30