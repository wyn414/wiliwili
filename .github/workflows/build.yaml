name: Build wiliwili + MPV for RG35XX Pro (aarch64)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      PREFIX: ${{ github.workspace }}/install
      SDL2_DIR: ${{ github.workspace }}/SDL2/install
      MPV_DIR: ${{ github.workspace }}/mpv/install

    steps:
    # ---------- 1. 检出代码及子模块 ----------
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # ---------- 2. 安装 aarch64 交叉编译器和基础依赖 ----------
    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git \
          cmake \
          ninja-build \
          pkg-config \
          python3 \
          python3-pip \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu \
          libgles2-mesa-dev \
          libegl1-mesa-dev \
          libx11-dev \
          libxext-dev \
          libxrandr-dev \
          libxi-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxfixes-dev \
          yasm \
          autoconf automake libtool \
          wget

    # ---------- 3. 编译 SDL2 ----------
    - name: Build SDL2 (OpenGLES)
      run: |
        git clone --depth 1 https://github.com/libsdl-org/SDL.git SDL2
        cd SDL2
        git checkout release-2.30.x
        mkdir build && cd build
        cmake .. \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DSDL_SHARED=OFF \
          -DSDL_STATIC=ON \
          -DSDL_VIDEO_OPENGL=OFF \
          -DSDL_VIDEO_OPENGL_ES=ON \
          -DSDL_OPENGLES=ON \
          -DSDL_VIDEO_X11=OFF \
          -DSDL_VIDEO_WAYLAND=OFF \
          -DSDL_VIDEO_KMSDRM=ON \
          -DSDL_VIDEO_FBDEV=ON \
          -DCMAKE_INSTALL_PREFIX=$PWD/install
        make -j$(nproc)
        make install

    # ---------- 4. 下载并编译 MPV ----------
    - name: Download and build MPV
      run: |
        wget https://github.com/mpv-player/mpv/archive/refs/tags/v1.36.0.tar.gz
        tar xf v1.36.0.tar.gz
        mv mpv-1.36.0 mpv
        cd mpv
        mkdir build && cd build
        PKG_CONFIG_PATH=$MPV_DIR/lib/pkgconfig \
        CC=aarch64-linux-gnu-gcc \
        CXX=aarch64-linux-gnu-g++ \
        ../waf configure \
          --prefix=$MPV_DIR \
          --cross-compile \
          --enable-static-build \
          --enable-gles2 \
          --disable-gl \
          --disable-libass \
          --disable-lua \
          --disable-joystick \
          --disable-drmprime \
          --disable-alsa \
          --disable-pulse \
          --disable-cplayer \
          --disable-build-date \
          --disable-tools
        ../waf build -j$(nproc)
        ../waf install

    # ---------- 5. 编译 wiliwili ----------
    - name: Build wiliwili
      run: |
        mkdir build && cd build
        cmake .. \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DCMAKE_PREFIX_PATH="$SDL2_DIR;$MPV_DIR" \
          -DWILIWILI_USE_SDL2=ON \
          -DWILIWILI_USE_OPENGL=OFF \
          -DWILIWILI_USE_OPENGL_ES=ON \
          -DWILIWILI_USE_VULKAN=OFF \
          -DPLATFORM_DESKTOP=ON \
          -DWILIWILI_USE_MPV=ON
        make -j$(nproc)

    # ---------- 6. 上传构建产物 ----------
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wiliwili-rg35xxpro-aarch64
        path: build/wiliwili
