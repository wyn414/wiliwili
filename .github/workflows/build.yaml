name: Build wiliwili for RG35XX Pro (aarch64)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Clean build'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      ARCH: aarch64
      CPU: cortex-a55
      CC: aarch64-linux-gnu-gcc
      CXX: aarch64-linux-gnu-g++
      AR: aarch64-linux-gnu-ar
      STRIP: aarch64-linux-gnu-strip
      INSTALL_DIR: ${{ github.workspace }}/install
      BUILD_TYPE: Release

    steps:
    # 1) 检查工作流触发
    - name: Debug workflow trigger
      run: |
        echo "🎉 工作流已触发！"
        echo "事件: ${{ github.event_name }}"
        echo "分支: ${{ github.ref }}"
        echo "提交: ${{ github.sha }}"

    # 2) 检出代码
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    # 3) 安装基础依赖
    - name: Install basic dependencies
      run: |
        echo "更新包列表..."
        sudo apt-get update -y
        
        echo "安装构建工具..."
        sudo apt-get install -y \
          build-essential \
          git cmake ninja-build pkg-config \
          python3 python3-pip python3-dev \
          wget curl tar gzip unzip \
          autoconf automake libtool gettext \
          yasm nasm flex bison meson
        
        echo "安装交叉编译工具链..."
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu \
          qemu-user qemu-user-static
        
        echo "安装主机架构开发库..."
        sudo apt-get install -y \
          libgles2-mesa-dev \
          libegl1-mesa-dev \
          libdrm-dev \
          libgbm-dev \
          libsdl2-dev \
          libfreetype-dev \
          libfontconfig-dev \
          libfribidi-dev \
          libharfbuzz-dev \
          libxml2-dev \
          libjpeg-dev \
          libpng-dev \
          liblua5.2-dev
        
        echo "安装多媒体库..."
        sudo apt-get install -y \
          libavcodec-dev \
          libavformat-dev \
          libavutil-dev \
          libswscale-dev \
          libavfilter-dev \
          libass-dev
        
        echo "清理缓存..."
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*

    # 4) 创建目录结构
    - name: Setup directories
      run: |
        echo "创建工作目录..."
        mkdir -p ${{ env.INSTALL_DIR }}
        mkdir -p ${{ env.INSTALL_DIR }}/lib
        mkdir -p ${{ env.INSTALL_DIR }}/include
        mkdir -p ${{ env.INSTALL_DIR }}/bin
        mkdir -p ${{ env.INSTALL_DIR }}/share
        
        echo "创建构建目录..."
        mkdir -p ${{ github.workspace }}/sdl2_build
        mkdir -p ${{ github.workspace }}/mpv_build
        mkdir -p ${{ github.workspace }}/wiliwili_build

    # 5) 创建交叉编译工具链文件
    - name: Create cross-compilation toolchain
      run: |
        cat > ${{ github.workspace }}/toolchain.cmake << 'EOF'
        # Cross-compilation toolchain for aarch64
        set(CMAKE_SYSTEM_NAME Linux)
        set(CMAKE_SYSTEM_PROCESSOR aarch64)
        
        # Cross compiler
        set(CMAKE_C_COMPILER aarch64-linux-gnu-gcc)
        set(CMAKE_CXX_COMPILER aarch64-linux-gnu-g++)
        set(CMAKE_AR aarch64-linux-gnu-ar)
        set(CMAKE_RANLIB aarch64-linux-gnu-ranlib)
        set(CMAKE_STRIP aarch64-linux-gnu-strip)
        
        # Sysroot
        set(CMAKE_SYSROOT /usr/aarch64-linux-gnu)
        set(CMAKE_FIND_ROOT_PATH ${CMAKE_SYSROOT})
        
        # Search rules
        set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
        set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
        set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
        set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
        
        # Compiler flags
        set(CMAKE_C_FLAGS "${CMAKE_C_FLAGS} -mcpu=${{ env.CPU }} -mtune=${{ env.CPU }} -fPIC -O2")
        set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -mcpu=${{ env.CPU }} -mtune=${{ env.CPU }} -fPIC -O2")
        
        # Linker flags
        set(CMAKE_EXE_LINKER_FLAGS "${CMAKE_EXE_LINKER_FLAGS} -Wl,-rpath-link,${CMAKE_SYSROOT}/lib")
        set(CMAKE_SHARED_LINKER_FLAGS "${CMAKE_SHARED_LINKER_FLAGS} -Wl,-rpath-link,${CMAKE_SYSROOT}/lib")
        EOF
        
        echo "工具链文件创建完成"

    # 6) 构建 SDL2
    - name: Build SDL2
      run: |
        cd ${{ github.workspace }}
        
        echo "下载 SDL2 源码..."
        # 使用更稳定的 2.26.x 版本
        wget -O sdl2.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-2.26.5/SDL2-2.26.5.tar.gz
        tar -xzf sdl2.tar.gz
        mv SDL2-2.26.5 sdl2_src
        
        cd sdl2_src
        
        echo "配置 SDL2..."
        # 使用 autotools 构建，更可靠
        ./configure \
          --host=aarch64-linux-gnu \
          --prefix=${{ env.INSTALL_DIR }} \
          --enable-static \
          --disable-shared \
          --disable-video-opengl \
          --enable-video-opengles \
          --disable-video-x11 \
          --disable-video-wayland \
          --enable-video-kmsdrm \
          --enable-video-fbdev \
          --disable-alsa \
          --disable-pulseaudio \
          --disable-esd \
          --disable-arts \
          --disable-nas \
          --disable-sndio \
          --disable-fusionsound
        
        echo "编译 SDL2..."
        make -j$(nproc)
        
        echo "安装 SDL2..."
        make install
        
        echo "SDL2 构建完成"
        ls -la ${{ env.INSTALL_DIR }}/lib/libSDL2*

    # 7) 构建 MPV（修复版本）
    - name: Build MPV
      run: |
        cd ${{ github.workspace }}
        
        echo "下载 MPV 源码..."
        # 使用更稳定的 0.35.x 版本
        wget -O mpv.tar.gz https://github.com/mpv-player/mpv/archive/refs/tags/v0.35.1.tar.gz
        tar -xzf mpv.tar.gz
        mv mpv-0.35.1 mpv_src
        
        cd mpv_src
        
        echo "运行引导脚本..."
        ./bootstrap.py
        
        echo "设置交叉编译环境变量..."
        # MPV 的 waf 通过环境变量识别交叉编译
        export CC="aarch64-linux-gnu-gcc"
        export CXX="aarch64-linux-gnu-g++"
        export AR="aarch64-linux-gnu-ar"
        export PKG_CONFIG="aarch64-linux-gnu-pkg-config"
        export PKG_CONFIG_PATH="${{ env.INSTALL_DIR }}/lib/pkgconfig"
        export CFLAGS="-mcpu=${{ env.CPU }} -mtune=${{ env.CPU }} -fPIC -O2"
        export CXXFLAGS="-mcpu=${{ env.CPU }} -mtune=${{ env.CPU }} -fPIC -O2"
        export LDFLAGS="-Wl,-rpath-link,/usr/aarch64-linux-gnu/lib -L${{ env.INSTALL_DIR }}/lib"
        
        echo "配置 MPV（最小化配置）..."
        # 注意：waf 不接受 --cc, --cxx, --ar 参数，通过环境变量传递
        ./waf configure \
          --prefix=${{ env.INSTALL_DIR }} \
          --enable-sdl2 \
          --enable-sdl2-audio \
          --enable-sdl2-video \
          --enable-egl \
          --enable-egl-drm \
          --enable-drm \
          --enable-gbm \
          --enable-gles2 \
          --disable-vulkan \
          --disable-vaapi \
          --disable-vdpau \
          --disable-wayland \
          --disable-x11 \
          --disable-cplayer \
          --disable-build-date \
          --disable-debug-build \
          --disable-libass \
          --disable-lua \
          --disable-javascript \
          --disable-rubberband \
          --disable-lcms2 \
          --disable-vapoursynth \
          --cross-compile
        
        echo "编译 MPV..."
        ./waf build -j$(nproc)
        
        echo "安装 MPV..."
        ./waf install
        
        echo "MPV 构建完成"
        ls -la ${{ env.INSTALL_DIR }}/lib/libmpv*

    # 8) 构建 wiliwili
    - name: Build wiliwili
      run: |
        cd ${{ github.workspace }}
        
        echo "=== 构建 wiliwili ==="
        
        # 设置环境变量
        export CC="aarch64-linux-gnu-gcc"
        export CXX="aarch64-linux-gnu-g++"
        export PKG_CONFIG="aarch64-linux-gnu-pkg-config"
        export PKG_CONFIG_PATH="${{ env.INSTALL_DIR }}/lib/pkgconfig:/usr/aarch64-linux-gnu/lib/pkgconfig"
        export LD_LIBRARY_PATH="${{ env.INSTALL_DIR }}/lib:/usr/aarch64-linux-gnu/lib"
        export CFLAGS="-mcpu=${{ env.CPU }} -mtune=${{ env.CPU }} -fPIC -O2"
        export CXXFLAGS="-mcpu=${{ env.CPU }} -mtune=${{ env.CPU }} -fPIC -O2"
        export LDFLAGS="-Wl,-rpath-link,${{ env.INSTALL_DIR }}/lib -Wl,-rpath-link,/usr/aarch64-linux-gnu/lib"
        
        # 创建构建目录
        mkdir -p wiliwili_build
        cd wiliwili_build
        
        # 清理（如果选择了 clean_build）
        if [ "${{ github.event.inputs.clean_build }}" = "true" ]; then
          echo "清理构建目录..."
          rm -rf *
        fi
        
        echo "配置 wiliwili..."
        # 使用简化的配置
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/toolchain.cmake \
          -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_DIR }} \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_PREFIX_PATH="${{ env.INSTALL_DIR }}" \
          -DCMAKE_MODULE_PATH="${{ env.INSTALL_DIR }}/lib/cmake" \
          # 关键配置
          -DPLATFORM_DESKTOP=ON \
          -DWILIWILI_USE_SDL2=ON \
          -DWILIWILI_USE_OPENGL=OFF \
          -DWILIWILI_USE_OPENGL_ES=ON \
          -DWILIWILI_USE_VULKAN=OFF \
          -DWILIWILI_USE_MPV=ON \
          # 其他选项
          -DWILIWILI_ENABLE_TESTS=OFF \
          -DWILIWILI_ENABLE_EXAMPLES=OFF \
          -DBUILD_SHARED_LIBS=ON \
          -DCMAKE_VERBOSE_MAKEFILE=ON \
          # 链接器设置
          -DCMAKE_EXE_LINKER_FLAGS="-Wl,-rpath,${{ env.INSTALL_DIR }}/lib -L${{ env.INSTALL_DIR }}/lib" \
          -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-rpath,${{ env.INSTALL_DIR }}/lib"
        
        echo "编译 wiliwili..."
        make -j$(nproc)
        
        # 检查输出
        if [ -f "wiliwili" ]; then
          echo "✅ wiliwili 构建成功！"
          echo "文件信息:"
          file wiliwili
          echo "文件大小:"
          ls -lh wiliwili
          
          # 复制到安装目录
          cp wiliwili ${{ env.INSTALL_DIR }}/bin/
          echo "✅ 已复制到 ${{ env.INSTALL_DIR }}/bin/"
        else
          echo "❌ 错误：未找到 wiliwili 可执行文件"
          echo "当前目录内容:"
          ls -la
          echo "尝试查找:"
          find . -type f -name "*wiliwili*" -o -name "*wili*" | head -20
          exit 1
        fi

    # 9) 测试二进制文件
    - name: Test binary
      run: |
        cd ${{ github.workspace }}
        
        echo "测试 wiliwili 二进制文件..."
        
        echo "二进制架构:"
        file wiliwili_build/wiliwili
        
        echo "检查动态库依赖:"
        # 尝试使用 readelf 而不是 ldd，避免运行
        aarch64-linux-gnu-readelf -d wiliwili_build/wiliwili | grep "NEEDED" || true
        
        echo "简单 qemu 测试..."
        # 安装 qemu
        sudo apt-get update && sudo apt-get install -y qemu-user qemu-user-static
        
        # 测试是否能被 qemu 加载（不实际运行）
        timeout 2s qemu-aarch64-static \
          -L /usr/aarch64-linux-gnu \
          -E LD_LIBRARY_PATH=${{ env.INSTALL_DIR }}/lib:/usr/aarch64-linux-gnu/lib \
          wiliwili_build/wiliwili --help 2>&1 | head -10 || echo "测试完成（可能正常退出）"

    # 10) 打包制品
    - name: Package artifacts
      run: |
        cd ${{ github.workspace }}
        
        echo "=== 打包制品 ==="
        
        # 创建分发目录
        DIST_DIR="dist/wiliwili_rg35xxpro"
        mkdir -p $DIST_DIR
        mkdir -p $DIST_DIR/libs
        
        # 复制可执行文件
        echo "复制 wiliwili..."
        cp wiliwili_build/wiliwili $DIST_DIR/
        chmod +x $DIST_DIR/wiliwili
        
        # 复制 SDL2 库
        echo "复制 SDL2 库..."
        cp ${{ env.INSTALL_DIR }}/lib/libSDL2*.so* $DIST_DIR/libs/ 2>/dev/null || echo "未找到 SDL2 库"
        
        # 复制 MPV 库
        echo "复制 MPV 库..."
        cp ${{ env.INSTALL_DIR }}/lib/libmpv*.so* $DIST_DIR/libs/ 2>/dev/null || echo "未找到 MPV 库"
        
        # 使用 readelf 查找依赖
        echo "查找动态库依赖..."
        if [ -f "$DIST_DIR/wiliwili" ]; then
          DEPS=$(aarch64-linux-gnu-readelf -d $DIST_DIR/wiliwili 2>/dev/null | grep "NEEDED" | sed -e 's/.*\[//' -e 's/\]//' || true)
          
          echo "找到的依赖:"
          echo "$DEPS"
          
          # 复制依赖库
          for lib in $DEPS; do
            echo "查找库: $lib"
            # 在安装目录中查找
            find ${{ env.INSTALL_DIR }}/lib -name "$lib" -exec cp -L {} $DIST_DIR/libs/ \; 2>/dev/null || true
            # 在系统目录中查找
            find /usr/aarch64-linux-gnu/lib -name "$lib" -exec cp -L {} $DIST_DIR/libs/ \; 2>/dev/null || true
            find /lib/aarch64-linux-gnu -name "$lib" -exec cp -L {} $DIST_DIR/libs/ \; 2>/dev/null || true
          done
        else
          echo "警告: 未找到 wiliwili 可执行文件"
        fi
        
        # 创建启动脚本
        cat > $DIST_DIR/run.sh << 'EOF'
        #!/bin/bash
        # wiliwili 启动脚本 for RG35XX Pro
        
        SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
        
        # 设置库路径
        export LD_LIBRARY_PATH="$SCRIPT_DIR/libs:$LD_LIBRARY_PATH"
        
        # SDL2 配置
        # RG35XX Pro 通常使用 kmsdrm 或 fbdev
        if [ -z "$SDL_VIDEODRIVER" ]; then
          # 按优先级尝试不同的驱动
          for driver in kmsdrm fbdev dummy; do
            echo "尝试 SDL 视频驱动: $driver"
            export SDL_VIDEODRIVER=$driver
            if ./wiliwili --version >/dev/null 2>&1; then
              echo "使用 SDL 视频驱动: $driver"
              break
            fi
          done
        fi
        
        # 默认值
        export SDL_VIDEODRIVER=${SDL_VIDEODRIVER:-kmsdrm}
        export SDL_AUDIODRIVER=${SDL_AUDIODRIVER:-alsa}
        
        # OpenGL ES 配置
        export MESA_GL_VERSION_OVERRIDE=3.0
        export MESA_GLES_VERSION_OVERRIDE=3.0
        
        echo "启动 wiliwili for RG35XX Pro..."
        echo "视频驱动: $SDL_VIDEODRIVER"
        echo "音频驱动: $SDL_AUDIODRIVER"
        echo "库路径: $LD_LIBRARY_PATH"
        
        # 运行 wiliwili
        cd "$SCRIPT_DIR"
        exec ./wiliwili "$@"
        EOF
        
        chmod +x $DIST_DIR/run.sh
        
        # 创建 README
        cat > $DIST_DIR/README.md << 'EOF'
        # wiliwili for RG35XX Pro
        
        ## 构建信息
        - 架构: aarch64 (ARM64)
        - CPU: Cortex-A55
        - 图形: SDL2 + OpenGL ES
        - 平台: 桌面模式 (PLATFORM_DESKTOP=ON)
        - 视频播放: MPV
        - 渲染: 软件渲染，无 X11
        
        ## 使用方法
        1. 将所有文件复制到 RG35XX Pro
        2. 运行:
           ```bash
           chmod +x run.sh
           ./run.sh
           ```
        
        3. 如果无法启动，尝试不同的 SDL 驱动:
           ```bash
           SDL_VIDEODRIVER=kmsdrm ./run.sh
           # 或
           SDL_VIDEODRIVER=fbdev ./run.sh
           ```
        
        ## 文件说明
        - `wiliwili`: 主程序
        - `run.sh`: 启动脚本
        - `libs/`: 依赖库目录
        - `README.md`: 说明文件
        
        构建时间: $(date)
        EOF
        
        # 创建版本信息
        cat > $DIST_DIR/version.txt << EOF
        wiliwili for RG35XX Pro
        =======================
        
        构建配置:
        - PLATFORM_DESKTOP=ON
        - WILIWILI_USE_SDL2=ON
        - WILIWILI_USE_OPENGL_ES=ON
        - WILIWILI_USE_MPV=ON
        - 无X11，软件渲染
        
        工具链:
        - 编译器: aarch64-linux-gnu-gcc
        - CPU: ${{ env.CPU }}
        - 构建类型: ${{ env.BUILD_TYPE }}
        
        依赖版本:
        - SDL2: 2.26.5
        - MPV: 0.35.1
        
        构建时间: $(date)
        构建提交: ${{ github.sha }}
        EOF
        
        echo "打包完成！"
        echo "分发目录内容:"
        ls -la $DIST_DIR/
        echo ""
        echo "库目录内容:"
        ls -la $DIST_DIR/libs/ 2>/dev/null || echo "库目录为空"

    # 11) 上传制品
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wiliwili-rg35xxpro-aarch64
        path: ${{ github.workspace }}/dist/wiliwili_rg35xxpro/**
        retention-days: 30

    # 12) 上传构建日志
    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          ${{ github.workspace }}/sdl2_src/config.log
          ${{ github.workspace }}/mpv_src/build/config.h
          ${{ github.workspace }}/mpv_src/build/config.log
          ${{ github.workspace }}/wiliwili_build/CMakeCache.txt
          ${{ github.workspace }}/wiliwili_build/CMakeFiles/CMakeOutput.log
        retention-days: 7

    # 13) 成功通知
    - name: Success notification
      if: success()
      run: |
        echo "✅ 构建成功完成！"
        echo "🎉 制品已生成并上传"
        echo "📦 下载链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

    # 14) 失败通知
    - name: Failure notification
      if: failure()
      run: |
        echo "❌ 构建失败！"
        echo "常见问题:"
        echo "1. 依赖包安装失败"
        echo "2. 网络连接问题"
        echo "3. 源代码编译错误"
        echo ""
        echo "详细日志: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"