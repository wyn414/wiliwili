name: Build wiliwili for RG35XX Pro

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
    # 1) 检出代码
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2) 安装依赖
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu \
          pkg-config \
          libsdl2-dev \
          libmpv-dev

    # 3) 构建 wiliwili
    - name: Build wiliwili
      run: |
        cd ${{ github.workspace }}
        mkdir -p build
        cd build
        
        echo "=== 开始构建 wiliwili ==="
        
        # 关键：必须设置 PLATFORM_DESKTOP=ON
        # 并且使用 pkg-config 环境变量来帮助找到 SDL2
        export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
        
        cmake .. \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DCMAKE_BUILD_TYPE=Release \
          # 这是必须的！否则会报错
          -DPLATFORM_DESKTOP=ON \
          # SDL2 配置
          -DWILIWILI_USE_SDL2=ON \
          -DWILIWILI_USE_OPENGL=OFF \
          -DWILIWILI_USE_OPENGL_ES=ON \
          -DWILIWILI_USE_VULKAN=OFF \
          # MPV 配置
          -DWILIWILI_USE_MPV=OFF \
          # 使用系统库
          -DUSE_SYSTEM_SDL2=ON
        
        echo "编译中..."
        make -j$(nproc)
        
        if [ -f "wiliwili" ]; then
          echo "✅ 构建成功！"
          echo "文件信息："
          file wiliwili
          echo "大小："
          ls -lh wiliwili
        else
          echo "❌ 构建失败"
          exit 1
        fi

    # 4) 上传二进制文件
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: wiliwili-aarch64
        path: ${{ github.workspace }}/build/wiliwili
        retention-days: 30