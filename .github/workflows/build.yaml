name: Build wiliwili for RG35XX Pro (aarch64)

on:
  push:
    branches: [ "**" ]  # 对所有分支push都触发
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Clean build'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      ARCH: aarch64
      CPU: cortex-a55
      CC: aarch64-linux-gnu-gcc
      CXX: aarch64-linux-gnu-g++
      AR: aarch64-linux-gnu-ar
      STRIP: aarch64-linux-gnu-strip
      INSTALL_DIR: ${{ github.workspace }}/install
      BUILD_TYPE: Release

    steps:
    # 1) 检查工作流触发
    - name: Debug workflow trigger
      run: |
        echo "🎉 工作流已触发！"
        echo "事件: ${{ github.event_name }}"
        echo "分支: ${{ github.ref }}"
        echo "工作区: ${{ github.workspace }}"
        echo "手动触发: ${{ github.event_name == 'workflow_dispatch' }}"
        echo "Clean build: ${{ github.event.inputs.clean_build || 'false' }}"

    # 2) 检出代码
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    # 3) 安装基础依赖（修复：只安装必要的主机架构包）
    - name: Install basic dependencies
      run: |
        echo "更新包列表..."
        sudo apt-get update -y
        
        echo "安装构建工具..."
        sudo apt-get install -y \
          build-essential \
          git cmake ninja-build pkg-config \
          python3 python3-pip python3-dev \
          wget curl tar gzip unzip \
          autoconf automake libtool gettext \
          yasm nasm flex bison \
          meson
        
        echo "安装交叉编译工具链..."
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu
        
        echo "安装主机架构开发库（用于构建工具）..."
        sudo apt-get install -y \
          libgles2-mesa-dev \
          libegl1-mesa-dev \
          libdrm-dev \
          libgbm-dev \
          libsdl2-dev \
          libfreetype-dev \
          libfontconfig-dev \
          libfribidi-dev \
          libharfbuzz-dev
        
        echo "安装系统工具..."
        sudo apt-get install -y \
          file tree patchelf
        
        echo "清理缓存..."
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*

    # 4) 创建目录结构
    - name: Setup directories
      run: |
        echo "创建工作目录..."
        mkdir -p ${{ env.INSTALL_DIR }}
        mkdir -p ${{ env.INSTALL_DIR }}/lib
        mkdir -p ${{ env.INSTALL_DIR }}/include
        mkdir -p ${{ env.INSTALL_DIR }}/bin
        
        echo "创建构建目录..."
        mkdir -p ${{ github.workspace }}/sdl2_build
        mkdir -p ${{ github.workspace }}/mpv_build
        mkdir -p ${{ github.workspace }}/wiliwili_build

    # 5) 创建交叉编译工具链文件
    - name: Create cross-compilation toolchain
      run: |
        cat > ${{ github.workspace }}/toolchain.cmake << 'EOF'
        # Cross-compilation toolchain for aarch64
        set(CMAKE_SYSTEM_NAME Linux)
        set(CMAKE_SYSTEM_PROCESSOR aarch64)
        
        # Cross compiler
        set(CMAKE_C_COMPILER aarch64-linux-gnu-gcc)
        set(CMAKE_CXX_COMPILER aarch64-linux-gnu-g++)
        set(CMAKE_AR aarch64-linux-gnu-ar)
        set(CMAKE_RANLIB aarch64-linux-gnu-ranlib)
        set(CMAKE_STRIP aarch64-linux-gnu-strip)
        
        # Sysroot
        set(CMAKE_SYSROOT /usr/aarch64-linux-gnu)
        set(CMAKE_FIND_ROOT_PATH ${CMAKE_SYSROOT})
        
        # Search rules
        set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
        set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
        set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
        set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
        
        # Compiler flags
        set(CMAKE_C_FLAGS "${CMAKE_C_FLAGS} -mcpu=${{ env.CPU }} -mtune=${{ env.CPU }} -fPIC -O2")
        set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -mcpu=${{ env.CPU }} -mtune=${{ env.CPU }} -fPIC -O2")
        
        # Linker flags
        set(CMAKE_EXE_LINKER_FLAGS "${CMAKE_EXE_LINKER_FLAGS} -Wl,-rpath-link,${CMAKE_SYSROOT}/lib")
        set(CMAKE_SHARED_LINKER_FLAGS "${CMAKE_SHARED_LINKER_FLAGS} -Wl,-rpath-link,${CMAKE_SYSROOT}/lib")
        
        # Pkg-config
        set(ENV{PKG_CONFIG_PATH} "${CMAKE_SYSROOT}/lib/pkgconfig")
        set(ENV{PKG_CONFIG_SYSROOT_DIR} ${CMAKE_SYSROOT})
        EOF
        
        echo "工具链文件创建完成"

    # 6) 构建 SDL2（简化版，确保成功）
    - name: Build SDL2
      run: |
        cd ${{ github.workspace }}
        
        echo "下载 SDL2 源码..."
        # 使用稳定的 2.28.x 版本
        wget -O sdl2.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-2.28.5/SDL2-2.28.5.tar.gz
        tar -xzf sdl2.tar.gz
        mv SDL2-2.28.5 sdl2_src
        
        cd sdl2_src
        
        echo "配置 SDL2..."
        # 使用 autotools 而不是 cmake，更可靠
        ./configure \
          --host=aarch64-linux-gnu \
          --prefix=${{ env.INSTALL_DIR }} \
          --enable-static \
          --disable-shared \
          --disable-video-opengl \
          --enable-video-opengles \
          --disable-video-x11 \
          --disable-video-wayland \
          --enable-video-kmsdrm \
          --enable-video-fbdev \
          --disable-alsa \
          --disable-pulseaudio \
          --disable-esd \
          --disable-arts \
          --disable-nas \
          --disable-sndio \
          --disable-fusionsound \
          --disable-libsamplerate
        
        echo "编译 SDL2..."
        make -j$(nproc)
        
        echo "安装 SDL2..."
        make install
        
        echo "SDL2 构建完成"
        ls -la ${{ env.INSTALL_DIR }}/lib/libSDL2*

    # 7) 构建依赖库（简单版本）
    - name: Build dependencies
      run: |
        cd ${{ github.workspace }}
        
        echo "=== 构建依赖库 ==="
        
        # 创建必要的 pkg-config 文件
        mkdir -p ${{ env.INSTALL_DIR }}/lib/pkgconfig
        
        # 为 OpenGL ES 创建 .pc 文件
        cat > ${{ env.INSTALL_DIR }}/lib/pkgconfig/glesv2.pc << 'EOF'
        prefix=/usr/aarch64-linux-gnu
        exec_prefix=${prefix}
        libdir=${prefix}/lib
        includedir=${prefix}/include
        
        Name: glesv2
        Description: OpenGL ES 2.0 library
        Version: 2.0
        Libs: -L${libdir} -lGLESv2
        Cflags: -I${includedir}
        EOF
        
        cat > ${{ env.INSTALL_DIR }}/lib/pkgconfig/egl.pc << 'EOF'
        prefix=/usr/aarch64-linux-gnu
        exec_prefix=${prefix}
        libdir=${prefix}/lib
        includedir=${prefix}/include
        
        Name: egl
        Description: EGL library
        Version: 1.5
        Libs: -L${libdir} -lEGL
        Cflags: -I${includedir}
        EOF

    # 8) 构建 MPV（最小化）
    - name: Build MPV (minimal)
      run: |
        cd ${{ github.workspace }}
        
        echo "下载 MPV 源码..."
        wget -O mpv.tar.gz https://github.com/mpv-player/mpv/archive/refs/tags/v0.36.0.tar.gz
        tar -xzf mpv.tar.gz
        mv mpv-0.36.0 mpv_src
        
        cd mpv_src
        
        echo "运行引导脚本..."
        ./bootstrap.py
        
        echo "配置环境变量..."
        export CC=${{ env.CC }}
        export CXX=${{ env.CXX }}
        export AR=${{ env.AR }}
        export PKG_CONFIG="aarch64-linux-gnu-pkg-config"
        export PKG_CONFIG_PATH="${{ env.INSTALL_DIR }}/lib/pkgconfig"
        export CFLAGS="-mcpu=${{ env.CPU }} -mtune=${{ env.CPU }} -fPIC -O2"
        export CXXFLAGS="-mcpu=${{ env.CPU }} -mtune=${{ env.CPU }} -fPIC -O2"
        export LDFLAGS="-Wl,-rpath-link,/usr/aarch64-linux-gnu/lib -L${{ env.INSTALL_DIR }}/lib"
        
        echo "配置 MPV..."
        ./waf configure \
          --prefix=${{ env.INSTALL_DIR }} \
          --cc=$CC \
          --cxx=$CXX \
          --ar=$AR \
          --pkg-config=$PKG_CONFIG \
          --enable-sdl2 \
          --enable-sdl2-audio \
          --enable-sdl2-gamepad \
          --enable-sdl2-video \
          --enable-egl \
          --enable-egl-drm \
          --enable-drm \
          --enable-gbm \
          --enable-gl \
          --enable-gles2 \
          --disable-vulkan \
          --disable-vaapi \
          --disable-vdpau \
          --disable-wayland \
          --disable-x11 \
          --disable-cplayer \
          --disable-build-date \
          --disable-debug-build \
          --cross-compile
        
        echo "编译 MPV..."
        ./waf build -j$(nproc)
        
        echo "安装 MPV..."
        ./waf install
        
        echo "MPV 构建完成"

    # 9) 构建 wiliwili（关键步骤）
    - name: Build wiliwili
      run: |
        cd ${{ github.workspace }}
        
        echo "=== 构建 wiliwili ==="
        
        # 设置环境变量
        export CC=${{ env.CC }}
        export CXX=${{ env.CXX }}
        export PKG_CONFIG="aarch64-linux-gnu-pkg-config"
        export PKG_CONFIG_PATH="${{ env.INSTALL_DIR }}/lib/pkgconfig"
        export LD_LIBRARY_PATH="${{ env.INSTALL_DIR }}/lib:/usr/aarch64-linux-gnu/lib"
        export CFLAGS="-mcpu=${{ env.CPU }} -mtune=${{ env.CPU }} -fPIC -O2"
        export CXXFLAGS="-mcpu=${{ env.CPU }} -mtune=${{ env.CPU }} -fPIC -O2"
        export LDFLAGS="-Wl,-rpath-link,${{ env.INSTALL_DIR }}/lib -Wl,-rpath-link,/usr/aarch64-linux-gnu/lib"
        
        # 创建构建目录
        mkdir -p wiliwili_build
        cd wiliwili_build
        
        # 清理（如果选择了 clean_build）
        if [ "${{ github.event.inputs.clean_build }}" = "true" ]; then
          echo "清理构建目录..."
          rm -rf *
        fi
        
        echo "配置 wiliwili..."
        # 使用简单的配置
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/toolchain.cmake \
          -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_DIR }} \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_PREFIX_PATH="${{ env.INSTALL_DIR }}" \
          -DPLATFORM_DESKTOP=ON \
          -DWILIWILI_USE_SDL2=ON \
          -DWILIWILI_USE_OPENGL=OFF \
          -DWILIWILI_USE_OPENGL_ES=ON \
          -DWILIWILI_USE_VULKAN=OFF \
          -DWILIWILI_USE_MPV=ON \
          -DWILIWILI_ENABLE_TESTS=OFF \
          -DWILIWILI_ENABLE_EXAMPLES=OFF \
          -DBUILD_SHARED_LIBS=ON \
          -DCMAKE_VERBOSE_MAKEFILE=ON
        
        echo "编译 wiliwili..."
        make -j$(nproc)
        
        # 检查输出
        if [ -f "wiliwili" ]; then
          echo "✅ wiliwili 构建成功！"
          echo "文件信息:"
          file wiliwili
          echo "文件大小:"
          ls -lh wiliwili
          
          # 复制到安装目录
          cp wiliwili ${{ env.INSTALL_DIR }}/bin/
        else
          echo "❌ 错误：未找到 wiliwili 可执行文件"
          echo "当前目录内容:"
          ls -la
          exit 1
        fi

    # 10) 测试可执行文件
    - name: Test binary
      run: |
        cd ${{ github.workspace }}
        
        echo "测试 wiliwili 二进制文件..."
        
        # 安装 qemu 进行测试
        sudo apt-get update
        sudo apt-get install -y qemu-user qemu-user-static
        
        # 测试二进制文件架构
        echo "二进制架构:"
        file wiliwili_build/wiliwili
        
        echo "尝试使用 qemu 运行（仅测试能否加载）..."
        # 简单测试，不实际运行
        timeout 5s qemu-aarch64-static \
          -L /usr/aarch64-linux-gnu \
          -E LD_LIBRARY_PATH=${{ env.INSTALL_DIR }}/lib:/usr/aarch64-linux-gnu/lib \
          wiliwili_build/wiliwili --version 2>&1 | head -20 || echo "测试完成"

    # 11) 打包制品
    - name: Package artifacts
      run: |
        cd ${{ github.workspace }}
        
        echo "=== 打包制品 ==="
        
        # 创建分发目录
        DIST_DIR="dist/wiliwili_rg35xxpro"
        mkdir -p $DIST_DIR
        mkdir -p $DIST_DIR/lib
        
        # 复制可执行文件
        echo "复制 wiliwili..."
        cp wiliwili_build/wiliwili $DIST_DIR/
        chmod +x $DIST_DIR/wiliwili
        
        # 复制 SDL2 库
        echo "复制 SDL2 库..."
        cp ${{ env.INSTALL_DIR }}/lib/libSDL2*.so* $DIST_DIR/lib/ 2>/dev/null || true
        
        # 复制 MPV 库
        echo "复制 MPV 库..."
        cp ${{ env.INSTALL_DIR }}/lib/libmpv*.so* $DIST_DIR/lib/ 2>/dev/null || true
        
        # 使用 ldd 查找依赖
        echo "查找动态库依赖..."
        DEPS=$(aarch64-linux-gnu-ldd $DIST_DIR/wiliwili 2>/dev/null | grep "=> /" | awk '{print $3}' || true)
        
        echo "找到的依赖:"
        echo "$DEPS"
        
        # 复制依赖库
        for lib in $DEPS; do
          if [ -f "$lib" ]; then
            echo "复制: $lib"
            cp -L "$lib" $DIST_DIR/lib/ 2>/dev/null || true
          fi
        done
        
        # 创建启动脚本
        cat > $DIST_DIR/run.sh << 'EOF'
        #!/bin/bash
        # wiliwili 启动脚本
        
        SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
        
        # 设置库路径
        export LD_LIBRARY_PATH="$SCRIPT_DIR/lib:$LD_LIBRARY_PATH"
        
        # SDL2 配置
        # 尝试不同的视频驱动
        export SDL_VIDEODRIVER=${SDL_VIDEODRIVER:-kmsdrm}
        export SDL_AUDIODRIVER=${SDL_AUDIODRIVER:-alsa}
        
        # OpenGL ES 配置
        export MESA_GL_VERSION_OVERRIDE=3.0
        export MESA_GLES_VERSION_OVERRIDE=3.0
        
        echo "启动 wiliwili..."
        echo "视频驱动: $SDL_VIDEODRIVER"
        echo "音频驱动: $SDL_AUDIODRIVER"
        echo "库路径: $LD_LIBRARY_PATH"
        
        cd "$SCRIPT_DIR"
        exec ./wiliwili "$@"
        EOF
        
        chmod +x $DIST_DIR/run.sh
        
        # 创建 README
        cat > $DIST_DIR/README.md << 'EOF'
        # wiliwili for RG35XX Pro
        
        这是一个为 RG35XX Pro 设备（ARM64/aarch64）构建的 wiliwili 版本。
        
        ## 构建信息
        - 架构: aarch64 (ARM64)
        - CPU: Cortex-A55
        - 图形: SDL2 + OpenGL ES
        - 平台: 桌面模式
        - 视频播放: MPV
        
        ## 使用方法
        1. 将所有文件复制到 RG35XX Pro
        2. 在终端中运行:
           ```bash
           chmod +x run.sh
           ./run.sh
           ```
        
        3. 如果无法启动，尝试不同的 SDL 驱动:
           ```bash
           SDL_VIDEODRIVER=kmsdrm ./run.sh
           # 或
           SDL_VIDEODRIVER=fbdev ./run.sh
           ```
        
        ## 文件说明
        - `wiliwili`: 主程序
        - `run.sh`: 启动脚本
        - `lib/`: 依赖库目录
        - `README.md`: 说明文件
        
        构建时间: $(date)
        EOF
        
        # 创建版本信息
        echo "wiliwili for RG35XX Pro" > $DIST_DIR/version.txt
        echo "构建日期: $(date)" >> $DIST_DIR/version.txt
        echo "Git提交: ${{ github.sha }}" >> $DIST_DIR/version.txt
        
        echo "打包完成！"
        echo "分发目录内容:"
        ls -la $DIST_DIR/
        echo ""
        echo "库目录内容:"
        ls -la $DIST_DIR/lib/

    # 12) 上传制品
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wiliwili-rg35xxpro-aarch64
        path: ${{ github.workspace }}/dist/wiliwili_rg35xxpro/**
        retention-days: 30

    # 13) 上传构建日志（可选）
    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          ${{ github.workspace }}/sdl2_src/config.log
          ${{ github.workspace }}/mpv_src/build/config.h
          ${{ github.workspace }}/wiliwili_build/CMakeCache.txt
        retention-days: 7

    # 14) 成功通知
    - name: Success notification
      if: success()
      run: |
        echo "✅ 构建成功完成！"
        echo "🎉 制品已生成并上传"
        echo "📦 下载链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

    # 15) 失败通知
    - name: Failure notification
      if: failure()
      run: |
        echo "❌ 构建失败！"
        echo "请检查以下可能的问题:"
        echo "1. 依赖包安装失败"
        echo "2. 网络连接问题"
        echo "3. 源代码编译错误"
        echo ""
        echo "详细日志: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"