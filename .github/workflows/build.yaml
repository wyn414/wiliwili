name: Build wiliwili for RG35XX Pro (aarch64)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    # ---------- 1. 安装 aarch64 交叉编译器 ----------
    - name: Install aarch64 toolchain and GLES headers
    run: |
    sudo dpkg --add-architecture arm64
    sudo apt update
    sudo apt install -y \
      gcc-aarch64-linux-gnu \
      g++-aarch64-linux-gnu \
      cmake \
      ninja-build \
      pkg-config \
      libegl1-mesa-dev:arm64 \
      libgles2-mesa-dev:arm64



    # ---------- 2. 编译 SDL2（OpenGLES） ----------
    - name: Build SDL2 (OpenGLES)
      run: |
        git clone https://github.com/libsdl-org/SDL.git
        cd SDL
        git checkout release-2.30.x

        mkdir build && cd build
        cmake .. \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DSDL_SHARED=OFF \
          -DSDL_STATIC=ON \
          -DSDL_VIDEO_OPENGL=OFF \
          -DSDL_VIDEO_OPENGL_ES=ON \
          -DSDL_OPENGLES=ON \
          -DSDL_VIDEO_X11=OFF \
          -DSDL_VIDEO_WAYLAND=OFF \
          -DSDL_VIDEO_KMSDRM=ON \
          -DSDL_VIDEO_FBDEV=ON \
          -DCMAKE_INSTALL_PREFIX=$PWD/install

        make -j$(nproc)
        make install

    # ---------- 3. 编译 wiliwili ----------
    - name: Build wiliwili
      run: |
        mkdir build && cd build

        cmake .. \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/SDL/build/install \
          -DWILIWILI_USE_SDL2=ON \
          -DWILIWILI_USE_OPENGL=OFF \
          -DWILIWILI_USE_OPENGL_ES=ON \
          -DWILIWILI_USE_VULKAN=OFF

        make -j$(nproc)

    # ---------- 4. 上传产物 ----------
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wiliwili-rg35xxpro-aarch64
        path: build/wiliwili
