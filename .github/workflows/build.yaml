name: Build wiliwili for RG35XX Pro

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
    # 1) 检出代码
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2) 安装工具和依赖（SDL2 相关）
    - name: Install tools and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu \
          pkg-config \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-ttf-dev \
          libsdl2-mixer-dev \
          libgles2-mesa-dev \
          libssl-dev \
          libwebp-dev \
          libavformat-dev \
          libavcodec-dev \
          libavutil-dev \
          libswscale-dev \
          libswresample-dev

    # 3) 直接修改 CMakeLists.txt 以跳过 MPV
    - name: Patch CMakeLists.txt to skip MPV
      run: |
        cd ${{ github.workspace }}
        
        echo "=== 修改 CMakeLists.txt 以跳过 MPV ==="
        
        # 备份原始文件
        cp CMakeLists.txt CMakeLists.txt.backup
        
        # 使用 sed 直接注释掉 find_package(MPV REQUIRED)
        sed -i 's/^[[:space:]]*find_package(MPV REQUIRED)/#find_package(MPV REQUIRED)/' CMakeLists.txt
        
        # 同时注释掉相关的消息和列表添加
        sed -i 's/^[[:space:]]*message(STATUS "Found libmpv:/#message(STATUS "Found libmpv:/' CMakeLists.txt
        sed -i 's/^[[:space:]]*list(APPEND APP_PLATFORM_INCLUDE ${MPV_INCLUDE_DIR})/#list(APPEND APP_PLATFORM_INCLUDE ${MPV_INCLUDE_DIR})/' CMakeLists.txt
        sed -i 's/^[[:space:]]*list(APPEND APP_PLATFORM_LIB ${MPV_LIBRARY})/#list(APPEND APP_PLATFORM_LIB ${MPV_LIBRARY})/' CMakeLists.txt
        
        echo "CMakeLists.txt 已修改"

    # 4) 修改构建配置，使用 SDL2 和 OpenGL ES2
    - name: Build wiliwili with SDL2 and OpenGL ES2
      run: |
        cd ${{ github.workspace }}
        
        echo "=== 构建 wiliwili (MPV 已跳过，使用 SDL2 + OpenGL ES2) ==="
        
        mkdir -p build
        cd build
        
        echo "配置..."
        # 使用 SDL2 平台，启用软件渲染，使用 OpenGL ES2
        cmake .. \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DCMAKE_BUILD_TYPE=Release \
          -DPLATFORM_DESKTOP=OFF \
          -DPLATFORM_LINUX_SDL=ON \
          -DGRAPHICS_API=OPENGL_ES2 \
          -DBUILD_SHARED_LIBS=OFF \
          -DUSE_SYSTEM_SDL2=OFF \
          -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++ -Wl,--as-needed" \
          -DCMAKE_CXX_FLAGS="-march=armv8-a+crc -mtune=cortex-a53 -O2 -fPIC"
        
        echo "编译..."
        make -j$(nproc)
        
        if [ -f "wiliwili" ]; then
          echo "✅ wiliwili 构建成功！"
          echo "文件信息："
          file wiliwili
          echo "大小："
          ls -lh wiliwili
          echo "依赖检查："
          aarch64-linux-gnu-readelf -d wiliwili | grep NEEDED
          
          # 恢复原始文件
          cd ..
          mv CMakeLists.txt.backup CMakeLists.txt
          echo "CMakeLists.txt 已恢复"
        else
          echo "❌ 构建失败"
          exit 1
        fi

    # 5) 上传二进制文件
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: wiliwili-aarch64-sdl2
        path: ${{ github.workspace }}/build/wiliwili
        retention-days: 30