    # 4) 构建静态链接版本
    - name: Build static wiliwili
      run: |
        cd ${{ github.workspace }}
        
        echo "=== 构建静态链接 wiliwili ==="
        
        mkdir -p build
        cd build
        
        echo "配置..."
        # 尝试静态链接
        cmake .. \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DCMAKE_BUILD_TYPE=Release \
          -DPLATFORM_DESKTOP=OFF \
          -DPLATFORM_LINUX_SDL=ON \
          -DGRAPHICS_API=SOFTWARE \  # 或 OPENGL_ES2
          -DBUILD_SHARED_LIBS=OFF \
          -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++ -Wl,--as-needed -Wl,--no-undefined" \
          -DCMAKE_CXX_FLAGS="-march=armv8-a+crc -mtune=cortex-a53 -O2 -fPIC -ffunction-sections -fdata-sections" \
          -DCMAKE_SHARED_LINKER_FLAGS="-Wl,--gc-sections"
        
        echo "编译..."
        make -j$(nproc)
        
        if [ -f "wiliwili" ]; then
          echo "✅ wiliwili 构建成功！"
          echo "文件信息："
          file wiliwili
          echo "大小："
          ls -lh wiliwili
          echo "检查是否静态链接："
          aarch64-linux-gnu-readelf -d wiliwili | grep NEEDED || echo "没有动态依赖（可能是静态链接）"
          
          cd ..
          mv CMakeLists.txt.backup CMakeLists.txt
        else
          echo "❌ 构建失败"
          exit 1
        fi